# Task filters and percentile cutoffs for the unified Agents on Rails benchmark.
task_types:
  - id: atomic
    label: Atomic tasks
    description: 19 small, self-contained tasks with a clear outcome.
  - id: features
    label: Feature tickets
    description: 20 tasks that resemble real product or engineering tickets.
  - id: multistep
    label: Multi-step tasks
    description: 7 long-horizon tasks, featuring both greenfield and brownfield development.
# Green and yellow cutoffs as fractions of the best-ranked configurations.
thresholds:
  accuracy: [0.2, 0.5]
  speed: [0.2, 0.5]
  tokens: [0.2, 0.5]
  cost: [0.2, 0.5]
